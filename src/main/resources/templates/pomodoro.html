<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" th:href="@{/css/pomodoro.css}"/>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">Health<span>Crypt</span> Engine</div>
    <div class="nav-links">
        <a href="/home" class="nav-back">← Back to Home</a>
        <form action="/logout" method="get" style="display:inline;">
            <button type="submit" class="btn-logout">⏻ Logout</button>
        </form>
    </div>
</nav>

<div class="main">

    <!-- MODE TABS -->
    <div class="mode-tabs">
        <button class="tab active" onclick="setMode('pomodoro')">Pomodoro</button>
        <button class="tab" onclick="setMode('short')">Short Break</button>
        <button class="tab" onclick="setMode('long')">Long Break</button>
    </div>
    <!-- Google Calendar Connect -->
    <div class="gcal-bar">
        <a th:if="${googleConnected == null}" href="/google/auth" class="btn-gcal">
            📅 Connect Google Calendar
        </a>
        <span th:if="${googleConnected != null}" class="gcal-connected">
            ✅ Google Calendar Connected — <a href="/calendar">View My Focus Calendar</a>
        </span>
    </div>
        
    <!-- TIMER CARD -->
    <div class="timer-card">
        <div class="timer-label" id="timerLabel">Focus Time</div>

        <div class="timer-scroll-row">
            <div class="scroll-unit">
                <div class="timer-display" id="minsDisplay">25</div>
            </div>
            <div class="timer-colon">:</div>
            <div class="scroll-unit">
                <div class="timer-display" id="secsDisplay">00</div>
            </div>
        </div>

        <div class="timer-controls">
            <button class="btn-control" onclick="resetTimer()">↺ Reset</button>
            <button class="btn-start" id="startBtn" onclick="toggleTimer()">▶ Start</button>
        </div>
    </div>

    <!-- SESSION INFO -->
    <div class="session-row">
        <div class="session-card">
            <div class="session-number" id="sessionCount">0</div>
            <div class="session-label">Sessions Done</div>
        </div>
        <div class="session-card">
            <div class="session-number" id="totalFocus">0 min</div>
            <div class="session-label">Total Focus Time</div>
        </div>
        <div class="session-card">
            <div class="session-number" id="currentStreak">0</div>
            <div class="session-label">Current Streak</div>
        </div>
    </div>

    <!-- TASK FOR THIS SESSION -->
    <div class="task-card">
        <h3>🎯 What are you working on?</h3>
        <div class="task-input-row">
            <input type="text" id="taskInput" placeholder="Enter your task..."/>
            <button onclick="setTask()">Set</button>
        </div>
        <div class="current-task" id="currentTask">No task set</div>
    </div>

</div>

<script>
    // MODES
    const modes = {
        pomodoro: { time: 25 * 60, label: "Focus Time" },
        short:    { time: 5  * 60, label: "Short Break" },
        long:     { time: 15 * 60, label: "Long Break"  }
    };

    let currentMode = 'pomodoro';
    let timeLeft = modes.pomodoro.time;
    let isRunning = false;
    let interval = null;
    let sessionCount = 0;
    let totalFocusSeconds = 0;

    // ✅ Mouse scroll on mins
    document.getElementById('minsDisplay').addEventListener('wheel', (e) => {
        e.preventDefault();
        if (isRunning) return;
        adjustDisplay(e.deltaY < 0 ? 1 : -1, 'mins');
    });

    // ✅ Mouse scroll on secs
    document.getElementById('secsDisplay').addEventListener('wheel', (e) => {
        e.preventDefault();
        if (isRunning) return;
        adjustDisplay(e.deltaY < 0 ? 1 : -1, 'secs');
    });



    function adjustDisplay(delta, unit) {
        if (isRunning) return; // cant adjust while running

        let mins = parseInt(document.getElementById('minsDisplay').textContent);
        let secs = parseInt(document.getElementById('secsDisplay').textContent);

        if (unit === 'mins') {
            mins += delta;
            if (mins < 0) mins = 99;
            if (mins > 99) mins = 0;
        } else {
            secs += delta;
            if (secs < 0) secs = 59;
            if (secs > 59) secs = 0;
        }

        document.getElementById('minsDisplay').textContent = String(mins).padStart(2, '0');
        document.getElementById('secsDisplay').textContent = String(secs).padStart(2, '0');

        // ✅ Save to current mode so reset comes back to this
        timeLeft = mins * 60 + secs;
        modes[currentMode].mins = mins;
        modes[currentMode].secs = secs;
    }

    function setMode(mode) {
        currentMode = mode;
        timeLeft = modes[mode].time;
        isRunning = false;
        clearInterval(interval);
        document.getElementById('startBtn').textContent = '▶ Start';
        document.getElementById('timerLabel').textContent = modes[mode].label;
        updateDisplay();

        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
    }

    function toggleTimer() {
        if (isRunning) {
            clearInterval(interval);
            isRunning = false;
            document.getElementById('startBtn').textContent = '▶ Start';
        } else {
            isRunning = true;
            document.getElementById('startBtn').textContent = '⏸ Pause';
            interval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    isRunning = false;
                    document.getElementById('startBtn').textContent = '▶ Start';
                    if (currentMode === 'pomodoro') {
                        sessionCount++;
                        document.getElementById('sessionCount').textContent = sessionCount;
                         // ✅ Log to Google Calendar
                        const duration = modes[currentMode].mins;
                        fetch(`/pomodoro/log?duration=${duration}`);
                    }
                    playBeep();
                    alert(currentMode === 'pomodoro' ? '✅ Session complete! Take a break.' : '⏰ Break over! Back to work.');
                    resetTimer();
                    return;
                }
                timeLeft--;
                if (currentMode === 'pomodoro') totalFocusSeconds++;
                updateDisplay();
                updateStats();
            }, 1000);
        }
    }

    function resetTimer() {
        clearInterval(interval);
        isRunning = false;
        // ✅ Always resets to whatever user set, not hardcoded 25
        timeLeft = modes[currentMode].mins * 60 + modes[currentMode].secs;
        document.getElementById('startBtn').textContent = '▶ Start';
        updateDisplay();
    }

    // function skipSession() {
    //     clearInterval(interval);
    //     isRunning = false;
    //     timeLeft = 0;
    //     document.getElementById('startBtn').textContent = '▶ Start';
    //     updateDisplay();
    // }

    function updateDisplay() {
        const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const secs = String(timeLeft % 60).padStart(2, '0');
        document.getElementById('minsDisplay').textContent = mins;
        document.getElementById('secsDisplay').textContent = secs;
        document.title = `${mins}:${secs} — Pomodoro`;
    }

    function updateStats() {
        const mins = Math.floor(totalFocusSeconds / 60);
        document.getElementById('totalFocus').textContent = `${mins} min`;
        document.getElementById('currentStreak').textContent = sessionCount;
    }

    function setTask() {
        const task = document.getElementById('taskInput').value;
        if (task.trim()) {
            document.getElementById('currentTask').textContent = '📌 ' + task;
        }
    }

    function playBeep() {
        const ctx = new AudioContext();
        const oscillator = ctx.createOscillator();
        oscillator.connect(ctx.destination);
        oscillator.frequency.value = 440;
        oscillator.start();
        oscillator.stop(ctx.currentTime + 0.5);
    }
</script>

</body>
</html>
