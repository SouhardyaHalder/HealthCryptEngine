<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 360px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h2 {
            color: #fff;
            text-align: center;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .subtitle {
            color: #aaa;
            text-align: center;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .error {
            background: rgba(255, 80, 80, 0.15);
            border: 1px solid rgba(255, 80, 80, 0.4);
            color: #ff6b6b;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
        }

        label {
            display: block;
            color: #ccc;
            font-size: 13px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 18px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: #4e9af1;
        }

        .btn-login {
            width: 100%;
            padding: 11px;
            background: #4e9af1;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 12px;
        }

        .btn-login:hover {
            background: #3a82d8;
        }

        .btn-signup {
            width: 100%;
            padding: 11px;
            background: transparent;
            color: #4e9af1;
            border: 1px solid #4e9af1;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-signup:hover {
            background: rgba(78, 154, 241, 0.1);
        }

        .divider {
            text-align: center;
            color: #555;
            font-size: 12px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>HealthCrypt Engine</h2>
    <p class="subtitle">Sign in to your account</p>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form action="/login" method="post">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username"/>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password"/>

        <button type="submit" class="btn-login">Login</button>
    </form>

    <div class="divider">or</div>

    <form action="/signup" method="get">
        <button type="submit" class="btn-signup">Create an Account</button>
    </form>
</div>
</body>
</html>
