<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Medical Record</title>
    <link rel="stylesheet" th:href="@{/css/medical.css}"/>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">Health<span>Crypt</span> Engine</div>
    <div class="nav-links">
        <a href="/medical" class="nav-back">← Back to Medical</a>
        <form action="/login" method="get" style="display:inline;">
            <button type="submit" class="btn-logout">⏻ Logout</button>
        </form>
    </div>
</nav>

<div class="main">
    <div class="page-header">
        <div>
            <p class="welcome-text">➕ Add New Record</p>
            <p class="welcome-sub">Fill in the details below</p>
        </div>
    </div>

    <div class="form-card">
        <form action="/medical/add" method="post">

            <div class="form-grid">

                <div class="form-group">
                    <label>Patient Name</label>
                    <input type="text" name="patientName" placeholder="Enter patient name" required/>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" name="age" placeholder="Enter age" required/>
                </div>

                <div class="form-group">
                    <label>Blood Group</label>
                    <select name="bloodGroup">
                        <option value="">-- Select --</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Doctor Name</label>
                    <input type="text" name="doctorName" placeholder="Enter doctor name" required/>
                </div>

                <div class="form-group">
                    <label>Date of Visit</label>
                    <input type="date" name="dateOfVisit" required/>
                </div>

<!--                <div class="form-group">-->
<!--                    <label>Blood Group</label>-->
<!--                    <input type="text" name="bloodGroup" placeholder="e.g. A+" required/>-->
<!--                </div>-->

                <div class="form-group full-width">
                    <label>Diagnosis</label>
                    <input type="text" name="diagnosis" placeholder="Enter diagnosis" required/>
                </div>

                <div class="form-group full-width">
                    <label>Prescription / Medicines</label>
                    <textarea name="prescription" rows="4" placeholder="Enter medicines or notes..."></textarea>
                </div>

            </div>

            <div class="form-actions">
                <a href="/medical" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-submit">Save Record</button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
